spring:
  application:
    name: trading-system

  datasource:
    url: jdbc:mysql://localhost:3306/trading_system?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root@123
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    defer-datasource-initialization: true  # ← ADD THIS LINE

  sql:
    init:
      mode: always

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.kshitij.trading: DEBUG